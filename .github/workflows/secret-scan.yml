name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 行业标准扫描器，扫全历史（fetch-depth: 0）
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 项目自带的规则扫描：覆盖 gitleaks 默认规则之外的 Notion token、占位符误报等
  rule-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files
        run: python .github/scripts/scan_secrets.py
