<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion2API 工作台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/marked@15.0.7/marked.min.js'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/dompurify@3.2.6/dist/purify.min.js'"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script defer src="vendor/katex/katex.min.js"></script>
<script defer src="vendor/katex/auto-render.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  font-size:14px;color:#111;background:#fff;
  display:flex;
}
.hidden{display:none!important}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:#111}
a{color:inherit;text-decoration:none}

/* ===== DARK THEME ===== */
[data-theme="dark"]{
  --bg:#1a1a1a;--bg-secondary:#222;--bg-hover:#2a2a2a;--bg-sidebar:#1e1e1e;
  --text:#e5e5e5;--text-secondary:#999;--text-tertiary:#666;
  --border:#333;--border-hover:#555;--border-active:#e5e5e5;
  --input-bg:#222;--card-bg:#1e1e1e;
  --user-bubble-bg:#2a2a2a;--thinking-bg:#1e1e1e;
  --send-bg:#e5e5e5;--send-color:#111;--send-hover:#ccc;
}
[data-theme="light"]{
  --bg:#fff;--bg-secondary:#fafafa;--bg-hover:#f0f0f0;--bg-sidebar:#fafafa;
  --text:#111;--text-secondary:#888;--text-tertiary:#aaa;
  --border:#e8e8e8;--border-hover:#bbb;--border-active:#000;
  --input-bg:#fff;--card-bg:#fff;
  --user-bubble-bg:#f5f5f5;--thinking-bg:#fafafa;
  --send-bg:#000;--send-color:#fff;--send-hover:#333;
}
body{background:var(--bg);color:var(--text)}

/* ===== SIDEBAR ===== */
.sidebar{
  width:220px;min-width:160px;max-width:400px;height:100vh;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .2s;
  z-index:100;
  position:relative;
}
.sidebar-resize-handle{
  position:absolute;top:0;right:-3px;width:6px;height:100%;
  cursor:col-resize;z-index:101;
}
.sidebar-resize-handle:hover,.sidebar-resize-handle.active{
  background:var(--border-active);opacity:.3;
}
.sidebar-top{
  height:48px;display:flex;align-items:center;
  padding:0 12px;gap:8px;flex-shrink:0;
}
.search-box{
  flex:1;display:flex;align-items:center;gap:6px;
  padding:0 8px;height:30px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg);
  font-size:13px;color:var(--text-secondary);cursor:text;
  transition:border-color .1s;
}
.search-box:hover{border-color:var(--border-hover)}
.search-box svg{flex-shrink:0;opacity:.5}
.search-box input{
  border:none;background:none;outline:none;
  font-size:13px;color:var(--text);width:100%;
}
.search-box input::placeholder{color:#bbb}
.new-chat-btn{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--text-secondary);
  transition:color .1s;border-radius:4px;
}
.new-chat-btn:hover{color:var(--text)}

/* Chat list */
.chat-list{flex:1;overflow-y:auto;padding:4px 0}
.chat-list::-webkit-scrollbar{width:4px}
.chat-list::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
[data-theme="dark"] .chat-list::-webkit-scrollbar-thumb{background:#444}

.chat-section-header{
  font-size:11px;text-transform:uppercase;color:var(--text-tertiary);
  letter-spacing:.08em;padding:12px 16px 4px;font-weight:500;
}
.chat-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px 6px 14px;cursor:pointer;
  font-size:13px;color:var(--text-secondary);
  border-left:2px solid transparent;
  transition:background .1s;
}
.chat-item:hover{background:var(--bg-hover)}
.chat-item.active{
  font-weight:500;color:var(--text);
  border-left-color:var(--border-active);
  background:var(--bg-hover);
}
.chat-item-title{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.chat-item-menu-btn{
  opacity:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--text-secondary);transition:opacity .1s;flex-shrink:0;
}
.chat-item:hover .chat-item-menu-btn{opacity:1}
.chat-item-menu-btn:hover{background:var(--border)}

/* Dropdown */
.chat-dropdown-container{position:relative;display:flex;align-items:center}
.custom-dropdown{
  display:none;position:absolute;right:0;top:100%;
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.08);
  min-width:120px;z-index:200;padding:4px;
}
.custom-dropdown.open{display:block}
.dropdown-item{
  display:block;width:100%;text-align:left;padding:6px 10px;
  font-size:12px;border-radius:4px;transition:background .1s;
}
.dropdown-item:hover{background:var(--bg-hover)}
.dropdown-item.danger{color:#d00}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

/* Sidebar footer */
.sidebar-footer{
  padding:8px 12px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:2px;flex-shrink:0;
}
.sidebar-footer-btn{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;font-size:12px;color:var(--text-secondary);
  border-radius:4px;transition:background .1s;
}
.sidebar-footer-btn:hover{background:var(--bg-hover);color:var(--text)}

/* ===== MAIN AREA ===== */
.main-area{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Header */
.main-header{
  height:48px;min-height:48px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
  border-bottom:1px solid var(--border);background:var(--bg);
  flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.sidebar-toggle-btn{
  display:none;width:32px;height:32px;
  align-items:center;justify-content:center;
  color:var(--text-secondary);border-radius:4px;
}
.sidebar-toggle-btn:hover{background:var(--bg-hover)}
.header-title{
  font-size:14px;font-weight:500;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:4px 8px;border-radius:4px;border:1px solid transparent;
  transition:border-color .1s;
}
.header-title:hover{border-color:var(--border)}
.header-title-input{
  font-size:14px;font-weight:500;border:1px solid var(--border-active);
  border-radius:4px;padding:4px 8px;outline:none;background:var(--bg);
  color:var(--text);
}
.header-right{display:flex;align-items:center;gap:12px}
.header-right .token-count{font-size:11px;color:var(--text-tertiary)}
.theme-toggle{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--text-secondary);transition:color .1s;
}
.theme-toggle:hover{color:var(--text)}

/* Memory banner */
.memory-banner{
  padding:8px 16px;background:#fffbe6;border-bottom:1px solid #f0e68c;
  font-size:12px;display:flex;align-items:center;gap:8px;
}
[data-theme="dark"] .memory-banner{background:#2a2500;border-color:#444}
.memory-banner-close{font-size:14px;margin-left:auto;opacity:.6}
.memory-banner-close:hover{opacity:1}

/* Chat container */
.chat-container{
  flex:1;overflow-y:auto;padding:24px 0;
  display:flex;flex-direction:column;
}
.chat-container::-webkit-scrollbar{width:6px}
.chat-container::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
[data-theme="dark"] .chat-container::-webkit-scrollbar-thumb{background:#444}

/* Welcome screen */
.welcome-screen{
  flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
  padding-bottom:18vh;
}
.welcome-title{
  font-size:36px;font-weight:300;color:var(--text);
}
.welcome-subtitle{
  font-size:13px;color:var(--text-tertiary);margin-bottom:32px;
}
.welcome-suggestions{
  display:flex;flex-direction:column;gap:6px;
  max-width:420px;width:100%;
}
.welcome-suggestion{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:8px;
  font-size:13px;color:var(--text-tertiary);
  border:1px solid transparent;
  cursor:pointer;transition:all .15s;
  text-align:left;line-height:1.4;
}
.welcome-suggestion:hover{
  color:var(--text-secondary);
  background:var(--bg-secondary);
  border-color:var(--border);
}
.welcome-suggestion svg{flex-shrink:0;opacity:.4}
.welcome-suggestion:hover svg{opacity:.7}
</style>
</head>
<body>
<!-- Mobile backdrop -->
<div id="mobileBackdrop" class="mobile-backdrop hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99"></div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
  <div class="brand">
    <div class="brand-mark">N</div>
    <div class="brand-text">
      <div class="brand-name">Notion2API</div>
      <div class="brand-tag">把 Notion 变成你的工作台</div>
    </div>
  </div>
  <button id="newChatBtn" class="new-chat-btn" title="新建对话">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>新建对话</span>
  </button>
  <div class="sidebar-top">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" name="chat-search" placeholder="搜索会话…"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
  <div id="chatList" class="chat-list"></div>
  <div class="status-card" id="statusCard">
    <div class="status-line">
      <span class="status-dot"></span>
      <span class="status-title" id="statusTitle">正在连接网关…</span>
      <span class="status-badge" id="statusAccounts">—</span>
    </div>
    <div class="status-sub" id="statusMeta">·</div>
  </div>
  <div class="sidebar-footer">
    <button id="opsToggleBtn" type="button" class="sidebar-footer-btn" title="账号池运行台">      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2.4-6.8L13.8 19l2.4-7H21"/></svg>
      运营面板
    </button>
    <button id="settingsBtn" class="sidebar-footer-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
    <div class="build-stamp" id="buildStamp"></div>
  </div>
</aside>

<!-- MAIN -->
<main class="main-area">
  <header class="main-header">
    <div class="header-left">
      <button id="openSidebarBtn" class="sidebar-toggle-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span id="headerTitle" class="header-title hidden">新对话</span>
    </div>
    <div class="header-right">
      <span id="tokenCount" class="token-count"></span>
      <button id="themeToggleBtn" class="theme-toggle" title="切换主题">
        <svg id="sunIcon" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div id="memoryBanner" class="memory-banner hidden">
    <span>上下文记忆有限，部分历史可能无法访问。</span>
    <button id="memoryBannerClose" class="memory-banner-close">x</button>
  </div>

  <div id="chatContainer" class="chat-container"></div>

  <div id="welcomeScreen" class="welcome-screen">
    <h1 class="welcome-title" id="welcomeGreeting">下午好。</h1>
    <p class="welcome-subtitle">选一个模型，直接开始提问。也可以先试试下面的例子。</p>
    <div id="welcomeSuggestions" class="welcome-suggestions"></div>
  </div>

  <!-- Input Area -->
  <div id="inputAreaWrapper" class="input-area-wrapper">
    <div class="input-card">
      <textarea id="chatInput" rows="1" placeholder="输入消息…" class="chat-input"></textarea>
      <div class="input-toolbar">
        <div class="toolbar-left">
          <div class="model-selector-container" id="modelSelectorContainer">
            <button id="modelTriggerBtn" type="button" class="model-trigger-btn">
              <span id="modelTriggerProvider" class="model-provider">Anthropic</span>
              <span class="model-dot"> · </span>
              <span id="modelTriggerText" class="model-name">Sonnet 4.6</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="customModelDropdown" class="model-dropdown">
              <div id="simpleModelList" class="model-list"></div>
            </div>
          </div>
        </div>
        <div class="toolbar-right">
          <button id="sendBtn" title="发送（Enter）" class="send-btn">
            <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            <svg id="stopIcon" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="input-footer">Enter 发送 · Shift + Enter 换行 · 内容由 AI 生成，请自行核实</div>
  </div>
</main>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>设置</h3>
      <button id="cancelSettingsBtn" class="modal-close-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>接口地址</label><input type="text" id="baseUrlInput" name="notion2api-base-url" placeholder="http://localhost:8000" autocomplete="off" spellcheck="false"></div>
      <div class="form-group"><label>API 密钥</label><input type="password" id="apiKeyInput" name="notion2api-api-key" placeholder="服务端未设置时才需要填写" autocomplete="new-password"></div>
    </div>
    <div class="modal-footer"><button id="saveSettingsBtn" class="btn-primary">保存</button></div>
  </div>
</div>

<!-- RENAME MODAL -->
<div id="renameModal" class="modal-overlay hidden">
  <div class="modal-content modal-sm">
    <div class="modal-header"><h3>重命名会话</h3></div>
    <div class="modal-body"><input type="text" id="renameModalInput" name="chat-rename" placeholder="输入会话标题" class="rename-input" autocomplete="off"></div>
    <div class="modal-footer">
      <button id="cancelRenameBtn" class="btn-secondary">Cancel</button>
      <button id="saveRenameBtn" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<style>
/* ===== INPUT AREA ===== */
.input-area-wrapper{padding:0 16px 12px;flex-shrink:0;max-width:800px;width:100%;margin:0 auto}
.input-card{
  border:1px solid var(--border);border-radius:12px;
  background:var(--card-bg);padding:12px 16px;
  transition:border-color .15s;
}
.input-card:focus-within{border-color:var(--border-hover)}
.chat-input{
  width:100%;border:none;background:none;outline:none;resize:none;
  font-size:14px;line-height:1.5;color:var(--text);
  min-height:24px;max-height:160px;
}
.chat-input::placeholder{color:#bbb}
.input-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.toolbar-left{display:flex;align-items:center}
.toolbar-right{display:flex;align-items:center}
.input-footer{text-align:center;font-size:11px;color:var(--text-tertiary);margin-top:6px}

/* Model selector */
.model-trigger-btn{
  display:flex;align-items:center;gap:0;
  padding:4px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--card-bg);font-size:13px;
  transition:border-color .1s;height:28px;
}
.model-trigger-btn:hover{border-color:var(--border-hover)}
.model-provider{color:var(--text-tertiary);font-size:12px}
.model-dot{color:var(--text-tertiary);font-size:12px}
.model-name{color:var(--text);font-size:13px;font-weight:500}
.model-trigger-btn svg{margin-left:6px;color:var(--text-tertiary)}

/* Model dropdown - opens UPWARD */
.model-selector-container{position:relative}
.model-dropdown{
  display:none;position:absolute;bottom:calc(100% + 6px);left:0;
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 -4px 20px rgba(0,0,0,.08);
  min-width:220px;max-height:360px;overflow-y:auto;
  z-index:300;padding:4px;
}
.model-dropdown.open{display:block}
.model-group-label{
  font-size:11px;text-transform:uppercase;color:var(--text-tertiary);
  letter-spacing:.08em;padding:8px 10px 4px;font-weight:500;
}
.model-option{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:6px 10px;font-size:13px;
  border-radius:4px;border-left:2px solid transparent;
  transition:background .1s;text-align:left;color:var(--text);
}
.model-option:hover{background:var(--bg-hover)}
.model-option.selected{border-left-color:var(--border-active);font-weight:500}
.model-option-left{display:flex;align-items:center;gap:8px}
.model-option-badge{
  font-size:10px;padding:1px 5px;border:1px solid var(--border);
  border-radius:3px;color:var(--text-tertiary);
}
.model-option-provider-badge{
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;border:1px solid var(--border);
  border-radius:4px;color:var(--text-secondary);flex-shrink:0;
}
.model-option-check{display:none}
.model-option.selected .model-option-check{display:block;color:var(--text)}
.model-group-divider{height:1px;background:var(--border);margin:4px 0}

/* Send button */
.send-btn{
  width:32px;height:32px;border-radius:8px;
  background:var(--send-bg);color:var(--send-color);
  display:flex;align-items:center;justify-content:center;
  transition:background .1s;
}
.send-btn:hover{background:var(--send-hover)}

/* ===== MESSAGES ===== */
.message-row{padding:4px 16px;max-width:800px;width:100%;margin:0 auto}
.user-message{display:flex;justify-content:flex-end;margin-bottom:16px}
.user-bubble{
  background:var(--user-bubble-bg);border-radius:12px;
  padding:10px 14px;max-width:75%;font-size:14px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
}

      if(!src||typeof src!=='object')return;
      const title=String(src.title||src.name||src.sourceTitle||src.url||src.href||'').trim();
      const url=String(src.url||src.href||src.link||'').trim();
      const snippet=String(src.snippet||src.summary||src.description||'').trim();
      if(!title&&!url)return;n.sources.push({title:title||url,url,snippet});
    });return n;
  }
};

/* ===== MARKDOWN ===== */
window.NotionAI.Utils.Markdown = {
  _cleanFootnotes(md){
    if(!md)return md;
    let c=md.replace(/\[\^(\d+)\]/g,'');
    c=c.replace(/^\[\^\d+\]:\s*.*$/gm,'');
    c=c.replace(/\n{3,}/g,'\n\n');
    return c.trim();
  },
  _escapeHtml(text){
    return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  },
  renderToSafeHtml(md){
    const source=this._cleanFootnotes(md||'');
    if(!window.marked||typeof window.marked.parse!=='function'||!window.DOMPurify||typeof window.DOMPurify.sanitize!=='function'){
      return `<p>${this._escapeHtml(source).replace(/\n/g,'<br>')}</p>`;
    }
    try{
      return window.DOMPurify.sanitize(window.marked.parse(source),{USE_PROFILES:{html:true},ADD_ATTR:['target','rel']});
    }catch(err){
      console.warn('Markdown rendering failed, falling back to plain text:',err);
      return `<p>${this._escapeHtml(source).replace(/\n/g,'<br>')}</p>`;
    }
  },
  setSafeMarkdown(el,md){
    el.innerHTML=this.renderToSafeHtml(md);
    this._processCitations(el);
    this.typesetMath(el);
  },
  /** LaTeX 排版：KaTeX 本地加载，带防抖，流式输出期间不会每个 token 重排 */
  typesetMath(el,immediate){
    if(!el)return;
    const raw=el.textContent||'';
    if(raw.indexOf('$')<0&&raw.indexOf('\(')<0&&raw.indexOf('\[')<0)return;
    if(!window.renderMathInElement)return;
    clearTimeout(el._mathTimer);
    const run=()=>{
      if(!window.renderMathInElement)return;
      try{
        window.renderMathInElement(el,{
          delimiters:[
            {left:'$$',right:'$$',display:true},
            {left:'\\[',right:'\\]',display:true},
            {left:'\\(',right:'\\)',display:false},
            {left:'$',right:'$',display:false}
          ],
          throwOnError:false,
          strict:false,
          ignoredTags:['pre','code','script','style','textarea','option','svg']
        });
      }catch(err){console.warn('公式渲染失败',err)}
    };
    if(immediate)run();else el._mathTimer=setTimeout(run,180);
  },
  _processCitations(container){
    // Collect all external links (skip anchors, code blocks, etc.)
    const links=Array.from(container.querySelectorAll('a[href]'));
    const externalLinks=links.filter(a=>{
      const href=a.getAttribute('href')||'';
      if(!href.startsWith('http'))return false;
      // Skip links inside code blocks
      if(a.closest('pre')||a.closest('code'))return false;
      return true;
    });
    if(!externalLinks.length)return;
    // Dedupe by URL, assign citation numbers
    const urlMap=new Map(); // url -> {num, title, url}
    let counter=0;
    externalLinks.forEach(a=>{
      const url=a.getAttribute('href');
      const title=a.textContent.trim()||url;
      if(!urlMap.has(url)){
        counter++;
        urlMap.set(url,{num:counter,title,url});
      }
    });
    // Replace each link with inline citation badge
    externalLinks.forEach(a=>{
      const url=a.getAttribute('href');
      const info=urlMap.get(url);
      if(!info)return;
      const badge=document.createElement('a');
      badge.className='cite-badge';
      badge.href=url;
      badge.target='_blank';
      badge.rel='noopener noreferrer';
      badge.textContent=info.num;
      // Tooltip
      const tip=document.createElement('span');
      tip.className='cite-tooltip';
      const tipTitle=document.createElement('div');
      tipTitle.className='cite-tooltip-title';
      tipTitle.textContent=info.title;
      tip.appendChild(tipTitle);
      const tipUrl=document.createElement('div');
      tipUrl.className='cite-tooltip-url';
      tipUrl.textContent=url.length>60?url.substring(0,60)+'...':url;
      tip.appendChild(tipUrl);
      badge.appendChild(tip);
      a.replaceWith(badge);
    });
    // Append reference list at bottom
    if(urlMap.size>0){
      const refList=document.createElement('div');
      refList.className='cite-ref-list';
      urlMap.forEach(info=>{
        const item=document.createElement('div');
        item.className='cite-ref-item';
        const num=document.createElement('span');
        num.className='cite-ref-num';
        num.textContent=info.num;
        const link=document.createElement('a');
        link.className='cite-ref-link';
        link.href=info.url;
        link.target='_blank';
        link.rel='noopener noreferrer';
        link.textContent=info.title;
        item.appendChild(num);
        item.appendChild(link);
        refList.appendChild(item);
      });
      container.appendChild(refList);
    }
  }
};

/* ===== DOM UTILS ===== */
window.NotionAI.Utils.DOM = {
  copyText(btn,text){navigator.clipboard.writeText(text).then(()=>{const o=btn.innerHTML;btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';setTimeout(()=>btn.innerHTML=o,2000)})},
  addCodeBlockCopyButtons(container){
    container.querySelectorAll('pre').forEach(pre=>{
      if(pre.querySelector('.code-copy-btn'))return;
      const code=pre.querySelector('code');if(!code)return;
      const bar=document.createElement('div');bar.className='code-toolbar';
      const m=(code.className||'').match(/language-([\w+#-]+)/);
      if(m){const lab=document.createElement('span');lab.className='code-lang-label';lab.textContent=m[1];bar.appendChild(lab)}
      const btn=document.createElement('button');btn.className='code-copy-btn';btn.type='button';btn.textContent='复制';
      btn.onclick=()=>{this.copyText(btn,code.innerText);btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',2000)};
      bar.appendChild(btn);
      pre.appendChild(bar);
      pre.classList.add('has-code-toolbar');
      this.addLineNumbers(pre);
    });
  },
  /** 给代码块加行号：只插入一列独立号槽，不动 <code> 内部结构 */
  addLineNumbers(pre){
    try{
      if(!pre||pre.dataset.numbered==='1')return;
      const code=pre.querySelector('code');if(!code)return;
      const text=(code.textContent||'').replace(/\n$/,'');   // 去掉结尾换行，避免多编一个空行
      const lines=text.split('\n');
      if(lines.length<3)return;                 // 一两行没必要编号
      const gutter=document.createElement('div');
      gutter.className='code-gutter';
      gutter.setAttribute('aria-hidden','true');
      let out='';
      for(let i=1;i<=lines.length;i++)out+=i+'\n';
      gutter.textContent=out;
      pre.insertBefore(gutter,pre.firstChild);
      pre.classList.add('has-line-numbers');
      pre.dataset.numbered='1';
    }catch(e){}
  },
  scrollToBottom(){const c=document.getElementById('chatContainer');if(c)c.scrollTo({top:c.scrollHeight,behavior:'smooth'})}
};
</script>

<script>
/* ===== API CLIENT ===== */
window.NotionAI.API.Client = {
  async post(endpoint,data,options={}){
    const r=await fetch(`${window.NotionAI.Core.State.get('baseUrl')}${endpoint}`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${window.NotionAI.Core.State.get('apiKey')}`,'X-Client-Type':window.NotionAI.Core.Constants.CLIENT_TYPE,...options.headers},
      body:JSON.stringify(data),...options});return r;
  },
  async delete(endpoint){
    return fetch(`${window.NotionAI.Core.State.get('baseUrl')}${endpoint}`,{
      method:'DELETE',headers:{'Authorization':`Bearer ${window.NotionAI.Core.State.get('apiKey')}`,'X-Client-Type':window.NotionAI.Core.Constants.CLIENT_TYPE}});
  },
  checkMemoryStatus(r){return(r.headers.get('X-Memory-Status')||'').toLowerCase()==='degraded'},
  getConversationId(r){return(r.headers.get('X-Conversation-Id')||'').trim()},
  async deleteConversation(id){try{const r=await this.delete(window.NotionAI.Core.Constants.API.DELETE_CONVERSATION(id));if(!r.ok&&r.status!==404)return false;return true}catch(e){return false}}
};

/* ===== MODELS ===== */
window.NotionAI.API.Models = {
  _currentModel:window.NotionAI.Core.Constants.DEFAULT_MODEL,_currentModelLabel:null,
  getCurrentModel(){return this._currentModel},
  getCurrentModelLabel(){if(!this._currentModelLabel)this._currentModelLabel=this.getModelDisplayName(this._currentModel);return this._currentModelLabel},
  setCurrentModel(id,label){this._currentModel=id;this._currentModelLabel=label},
  getModelDisplayName(id){const n=window.NotionAI.Core.State.get('modelDisplayNames');return n[id]||id},
  getModelProvider(id){return window.NotionAI.Core.Constants.MODEL_PROVIDERS[id]||''},
  loadModels(){
    window.NotionAI.Core.State.set('modelDisplayNames',{...window.NotionAI.Core.Constants.MODEL_DISPLAY_NAMES});
    // 换了 key/baseUrl 就重新尝试同步
    this._authBlockedKey=null;this._everOk=false;
    this.refreshFromServer({silent:true});
  },
  _lastSync:0,_everOk:false,_authBlockedKey:null,
  /* 厂商标识 → 分组；顺序即下拉里的展示顺序 */
  _rules:[
    {re:/^claude-/i,g:'Anthropic',p:'Anthropic'},
    {re:/^fable-/i,g:'Anthropic',p:'Anthropic'},
    {re:/^(gpt-|chatgpt|o[1-9])/i,g:'OpenAI',p:'OpenAI'},
    {re:/^gemini-/i,g:'Google',p:'Google'},
    {re:/^(grok-|spacexai-)/i,g:'xAI',p:'xAI'},
    {re:/^kimi-/i,g:'月之暗面',p:'月之暗面'},
    {re:/^deepseek-/i,g:'深度求索',p:'深度求索'},
    {re:/^glm-/i,g:'智谱 AI',p:'智谱 AI'},
    {re:/^qwen/i,g:'阿里通义',p:'阿里通义'},
    {re:/^doubao/i,g:'字节豆包',p:'字节豆包'},
    {re:/^hunyuan/i,g:'腾讯混元',p:'腾讯混元'},
    {re:/^ernie/i,g:'百度文心',p:'百度文心'},
    {re:/^minimax/i,g:'MiniMax',p:'MiniMax'},
    {re:/^step/i,g:'阶跃星辰',p:'阶跃星辰'}
  ],
  /** 版本号（≈发布顺序）：取 id 里第一段数字，build 类视为最新 */
  _versionKey(id){
    const s=String(id);
    if(/build/i.test(s)) return [9999,0];
    const m=s.match(/(\d+(?:\.\d+)?)/);
    if(!m) return [9998,0];
    const parts=m[1].split('.');
    return [Number(parts[0])||0,Number(parts[1])||0];
  },
  _buildGroups(ids){
    const known=window.NotionAI.Core.Constants.MODEL_DISPLAY_NAMES||{};
    const self=this;
    const order=['Anthropic','OpenAI','Google','xAI','月之暗面','深度求索','智谱 AI','阿里通义',
                 '字节豆包','腾讯混元','百度文心','MiniMax','阶跃星辰','其他'];
    const buckets=new Map(order.map(k=>[k,[]]));
    ids.forEach(id=>{
      const rule=this._rules.find(r=>r.re.test(id));
      const group=rule?rule.g:'其他';
      buckets.get(group).push({
        id,
        label:known[id]||id,
        provider:rule?rule.p:'其他'
      });
    });
    // 厂商之间保持固定顺序；厂商内部按版本号升序（≈发布顺序）
    return order.filter(k=>buckets.get(k).length)
      .map(k=>({
        label:k,
        models:buckets.get(k).sort((a,b)=>{
          const va=self._versionKey(a.id),vb=self._versionKey(b.id);
          // 版本号降序：最新发布的排最上面
          return (vb[0]-va[0])||(vb[1]-va[1])||String(a.id).localeCompare(String(b.id));
        })
      }));
  },
  /** 拉取 /v1/models 重建列表；服务端不可达时保持现有静态列表 */
  refreshFromServer(opts){
    const silent=!(opts&&opts.silent===false);
    try{ if(typeof STATE!=='undefined'&&STATE.isGenerating&&silent) return Promise.resolve(null) }catch(e){}
    const base=(window.NotionAI.Core.State.get('baseUrl')||'').replace(/\/+$/,'');
    const key=window.NotionAI.Core.State.get('apiKey')||'';
    if(!base) return Promise.resolve(null);
    // 没配 key 且从未成功过：直接跳过，别每次加载都往控制台刷 401
    if(!key&&!this._everOk) return Promise.resolve(null);
    // 这个 key 已被服务端拒绝过：换 key 之前不再重试
    if(this._authBlockedKey!==null&&this._authBlockedKey===key) return Promise.resolve(null);
    const self=this;
    return fetch(base+'/v1/models',{headers:{Authorization:'Bearer '+key},cache:'no-store'})
      .then(r=>{
        if(r.status===401||r.status===403){self._authBlockedKey=key;throw new Error('HTTP '+r.status)}
        if(!r.ok)throw new Error('HTTP '+r.status);
        self._everOk=true;self._authBlockedKey=null;
        return r.json();
      })
      .then(payload=>{
        const ids=((payload&&payload.data)||[]).map(m=>m&&m.id).filter(Boolean);
        if(!ids.length) return null;
        const groups=self._buildGroups(ids);
        const flat=[].concat.apply([],groups.map(g=>g.models));
        const names={};
        flat.forEach(m=>{names[m.id]=m.label});

        window.NotionAI.Core.Constants.MODEL_GROUPS=groups;
        window.NotionAI.Core.Constants.MODEL_DISPLAY_NAMES=names;
        window.NotionAI.Core.Constants.MODELS=flat.map(m=>({id:m.id,label:m.label}));
        window.NotionAI.Core.State.set('modelDisplayNames',names);

        // 当前选中的模型若已下线，回退到第一个可用模型
        const cur=self.getCurrentModel();
        if(!flat.some(m=>m.id===cur)&&flat.length){
          const first=flat[0];
          self.setCurrentModel(first.id,first.label);
          const t=document.getElementById('modelTriggerText');
          const p=document.getElementById('modelTriggerProvider');
          if(t)t.textContent=first.label;
          if(p)p.textContent=first.provider;
        }
        self._lastSync=Date.now();
        if(typeof populateModels==='function') populateModels();
        return {count:flat.length,groups:groups.length};
      })
      .catch(()=>null);
  },
  getAvailableModels(){return window.NotionAI.Core.Constants.MODELS}
};

/* ===== SETTINGS ===== */
window.NotionAI.API.Settings = {
  open(){document.getElementById('baseUrlInput').value=window.NotionAI.Core.State.get('baseUrl');document.getElementById('apiKeyInput').value=window.NotionAI.Core.State.get('apiKey');document.getElementById('settingsModal').classList.remove('hidden')},
  close(){document.getElementById('settingsModal').classList.add('hidden')},
  save(){const b=document.getElementById('baseUrlInput').value.trim().replace(/\/$/,"");const k=document.getElementById('apiKeyInput').value.trim();window.NotionAI.Core.State.set('baseUrl',b);window.NotionAI.Core.State.set('apiKey',k);localStorage.setItem('claude_base_url',b);window.NotionAI.Core.State.persistApiKey(k);this.close();window.NotionAI.API.Models.loadModels()}
};

/* ===== STORAGE ===== */
window.NotionAI.Chat.Storage = {
  saveChats(){localStorage.setItem('claude_chats',JSON.stringify(window.NotionAI.Core.State.get('chats')))},
  loadChats(){
    // 主键损坏/为空时从备份恢复，避免一次坏写把历史彻底冲掉
    let parsed=null;
    try{ parsed=JSON.parse(localStorage.getItem('claude_chats')||'null') }catch(e){ parsed=null }
    if(!Array.isArray(parsed)||!parsed.length){
      try{ parsed=JSON.parse(localStorage.getItem('claude_chats_backup')||'null') }catch(e){ parsed=null }
    }
    const c=Array.isArray(parsed)?parsed:[];
    const s=window.NotionAI.Utils.Validation.sanitizeChats(c);
    window.NotionAI.Core.State.set('chats',s);
    return s;
  },
  /** 写主键前先转存旧值；两条都失败才算丢 */
  saveChats(){
    try{
      const cur=localStorage.getItem('claude_chats');
      if(cur)localStorage.setItem('claude_chats_backup',cur);
    }catch(e){}
    try{ localStorage.setItem('claude_chats',JSON.stringify(window.NotionAI.Core.State.get('chats'))) }catch(e){}
  },
  addMessage(msg){const chats=window.NotionAI.Core.State.get('chats');const chat=chats.find(c=>c.id===window.NotionAI.Core.State.get('currentChatId'));if(chat){chat.messages.push(msg);this.saveChats()}},
  updateConversationId(chatId,convId){const chats=window.NotionAI.Core.State.get('chats');const chat=chats.find(c=>c.id===chatId);if(chat){chat.conversationId=convId;this.saveChats()}},
  deleteChat(chatId){
    let chats=window.NotionAI.Core.State.get('chats');
    chats=chats.filter(c=>String(c.id)!==String(chatId));
    window.NotionAI.Core.State.set('chats',chats);
    this.saveChats();
    try{ if(String(window.NotionAI.Core.State.get('currentChatId'))===String(chatId))localStorage.removeItem('claude_last_chat') }catch(e){}
  },
  updateChatTitle(chatId,title){const chats=window.NotionAI.Core.State.get('chats');const chat=chats.find(c=>c.id===chatId);if(chat){chat.title=title;this.saveChats()}},
  toggleStar(chatId){const chats=window.NotionAI.Core.State.get('chats');const chat=chats.find(c=>c.id===chatId);if(chat){chat.starred=!chat.starred;this.saveChats()}}
};
</script>

<script>
/* ===== RENDERER ===== */
window.NotionAI.Chat.Renderer = {
  createMessageElement(role, modelDisplayName) {
    const wrapper = document.createElement('div');
    wrapper.className = `message-row ${role==='user'?'user-message':'assistant-message'} fade-in`;
    if (role === 'user') {
      const umeta = document.createElement('div');
      umeta.className = 'user-meta';
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = '你';
      const utime = document.createElement('span');
      const uNow = new Date();
      utime.textContent = uNow.getHours().toString().padStart(2,'0') + ':' + uNow.getMinutes().toString().padStart(2,'0');
      umeta.appendChild(who);
      umeta.appendChild(utime);
      wrapper.appendChild(umeta);
      const bubble = document.createElement('div');
      bubble.className = 'user-bubble';
      wrapper.appendChild(bubble);
      const userCopyRow = document.createElement('div');
      userCopyRow.className = 'message-copy-row';
      const userCopyBtn = document.createElement('button');
      userCopyBtn.className = 'message-copy-btn';
      userCopyBtn.textContent = '复制';
      userCopyBtn.onclick = () => {
        navigator.clipboard.writeText(bubble.innerText).then(() => { userCopyBtn.textContent='已复制'; setTimeout(()=>userCopyBtn.textContent='复制',2000) });
      };
      const userEditBtn = document.createElement('button');
      userEditBtn.className = 'message-copy-btn';
      userEditBtn.textContent = '编辑';
      userEditBtn.title = '修改后重新发送';
      userEditBtn.onclick = () => { if (typeof beginEditMessage === 'function') beginEditMessage(wrapper); };
      userCopyRow.appendChild(userCopyBtn);
      userCopyRow.appendChild(userEditBtn);
      wrapper.appendChild(userCopyRow);
      return { wrapper, bubble };
    }
    const content = document.createElement('div');
    content.className = 'assistant-content';
    const meta = document.createElement('div');
    meta.className = 'assistant-meta';
    const ml = document.createElement('span');
    ml.className = 'assistant-model-name';
    ml.textContent = '助手' + (modelDisplayName ? ' · ' + modelDisplayName : '');
    meta.appendChild(ml);
    const ts = document.createElement('span');
    ts.className = 'message-timestamp';
    const now = new Date();
    ts.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    meta.appendChild(ts);
    const cb = document.createElement('button');
    cb.className = 'message-copy-btn';
    cb.textContent = '复制';
    cb.onclick = () => {
      const md = wrapper.mdDivRef;
      if (md) navigator.clipboard.writeText(md.innerText).then(() => { cb.textContent='已复制'; setTimeout(()=>cb.textContent='复制',2000) });
    };
    // Copy button is now at bottom of message, not in meta
    content.appendChild(meta);
    wrapper.appendChild(content);
    return { wrapper, bubble: content };
  },

  updateAIMessage(wrapper, content, isFinished) {
    const mdDiv = wrapper.mdDivRef;
    if (!content && !isFinished) {
      mdDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      return;
    }
    mdDiv.classList.remove('streaming-cursor');
    window.NotionAI.Utils.Markdown.setSafeMarkdown(mdDiv, content);
    if (isFinished) {
      mdDiv.classList.remove('streaming-cursor');
      mdDiv.querySelectorAll('pre code').forEach(b => { if(!b.dataset.highlighted) hljs.highlightElement(b) });
      window.NotionAI.Utils.DOM.addCodeBlockCopyButtons(mdDiv);
      if (wrapper._thinkingTimerInterval) { clearInterval(wrapper._thinkingTimerInterval); wrapper._thinkingTimerInterval = null }
    } else {
      mdDiv.classList.add('streaming-cursor');
    }
    const cc = document.getElementById('chatContainer');
    if (cc.scrollHeight - cc.scrollTop < cc.clientHeight + 120) window.NotionAI.Utils.DOM.scrollToBottom();
  },

  updateThinkingPanel(wrapper) {
    const card = wrapper.thinkingCardRef;
    if (!card) return;
    const raw = String(wrapper.thinkingText || '');
    if (!raw.trim()) { card.classList.add('hidden'); return }
    card.classList.remove('hidden');
    const timer = card.querySelector('.thinking-header-timer');
    if (timer && wrapper._thinkingStartTime) {
      timer.textContent = Math.round((Date.now() - wrapper._thinkingStartTime) / 1000) + 's';
    }
    if (wrapper.thinkingExpanded) {
      card.classList.add('expanded');
      window.NotionAI.Utils.Markdown.setSafeMarkdown(wrapper.thinkingBodyRef, raw);
    } else {
      card.classList.remove('expanded');
    }
  },

  updateSearchPanel(wrapper) {
    const card = wrapper.searchCardRef;
    if (!card) return;
    const queries = wrapper.searchData?.queries || [];
    const sources = wrapper.searchData?.sources || [];
    if (!queries.length && !sources.length) { card.classList.add('hidden'); return }
    card.classList.remove('hidden');
    const count = sources.length || queries.length;
    const hl = card.querySelector('.search-header-label');
    if (hl) hl.textContent = `已搜索 ${count} 个来源`;
    const qt = card.querySelector('.search-query-text');
    if (qt) qt.textContent = queries.length ? `Queries: ${queries.map(q=>`"${q}"`).join(', ')}` : 'Web search executed';
    const lc = card.querySelector('.search-links-container');
    if (lc) {
      lc.innerHTML = '';
      if (!sources.length) { lc.innerHTML = '<div style="color:var(--text-tertiary)">暂无来源。</div>' }
      else sources.forEach(src => {
        if (src.url) { const a=document.createElement('a');a.className='search-link';a.href=src.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=src.title||src.url;lc.appendChild(a) }
        else { const d=document.createElement('div');d.textContent=src.title;d.style.fontSize='12px';lc.appendChild(d) }
      });
    }
    if (wrapper.searchExpanded) card.classList.add('expanded'); else card.classList.remove('expanded');
  },

  appendMessage(role, content, isFinished, modelDisplayName) {
    const name = (modelDisplayName || window.NotionAI.API.Models.getModelDisplayName(window.NotionAI.API.Models.getCurrentModel())).trim() || '助手';
    const { wrapper, bubble } = this.createMessageElement(role, name);
    if (role === 'user') { bubble.textContent = content }
    else {
      const refs = this._buildAssistantContent(bubble, content, isFinished, name);
      Object.assign(wrapper, refs);
      this._setupPanelListeners(wrapper);
    }
    document.getElementById('chatContainer').appendChild(wrapper);
    return wrapper;
  },

  _buildAssistantContent(container, content, isFinished, modelDisplayName) {
    // Search card
    const sc = document.createElement('div');
    sc.className = 'search-card hidden';
    sc.innerHTML = '<div class="search-header"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span class="search-header-label">Searched 0 sources</span><span class="search-header-arrow" style="margin-left:auto;font-size:10px">&#9656;</span></div><div class="search-body"><div class="search-query-text"></div><div class="search-links-container"></div></div>';
    container.appendChild(sc);
    // Thinking card
    const tc = document.createElement('div');
    tc.className = 'thinking-card hidden';
    tc.innerHTML = '<div class="thinking-header"><span class="thinking-header-dot"></span><span class="thinking-header-label">思考中</span><span class="thinking-header-timer"></span><span class="thinking-header-arrow">&#9656;</span></div><div class="thinking-body"><div class="markdown-body thinking-markdown"></div></div>';
    container.appendChild(tc);
    // Markdown
    const md = document.createElement('div');
    md.className = 'markdown-body';
    container.appendChild(md);
    if (content === '') {
      if (isFinished) window.NotionAI.Utils.Markdown.setSafeMarkdown(md, '*暂无可见回复。*');
      else md.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
    } else {
      window.NotionAI.Utils.Markdown.setSafeMarkdown(md, content);
      if (isFinished) { md.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b)); window.NotionAI.Utils.DOM.addCodeBlockCopyButtons(md) }
    }
    // Copy button at bottom of message
    const copyBtnWrapper = document.createElement('div');
    copyBtnWrapper.className = 'message-copy-row';
    const cb = document.createElement('button');
    cb.className = 'message-copy-btn';
    cb.textContent = '复制';
    cb.onclick = () => {
      if (md) navigator.clipboard.writeText(md.innerText).then(() => { cb.textContent='已复制'; setTimeout(()=>cb.textContent='复制',2000) });
    };
    const rb = document.createElement('button');
    rb.className = 'message-copy-btn';
    rb.textContent = '重新生成';
    rb.title = '从最后一条提问重新生成';
    rb.onclick = () => { if (typeof regenerateLastAnswer === 'function') regenerateLastAnswer(); };
    copyBtnWrapper.appendChild(cb);
    copyBtnWrapper.appendChild(rb);
    container.appendChild(copyBtnWrapper);
    return {
      bubbleRef:container, mdDivRef:md,
      searchCardRef:sc, searchExpanded:false, searchData:{queries:[],sources:[]},
      thinkingCardRef:tc, thinkingBodyRef:tc.querySelector('.thinking-body .thinking-markdown'),
      thinkingExpanded:false, thinkingText:'', thinkingModelDisplayName:modelDisplayName,
      _thinkingStartTime:isFinished?null:Date.now(), _thinkingTimerInterval:null,
    };
  },

  _setupPanelListeners(wrapper) {
    const th = wrapper.querySelector('.thinking-header');
    const sh = wrapper.querySelector('.search-header');
    if (th) th.addEventListener('click', () => { wrapper.thinkingExpanded=!wrapper.thinkingExpanded; this.updateThinkingPanel(wrapper) });
    if (sh) sh.addEventListener('click', () => { wrapper.searchExpanded=!wrapper.searchExpanded; this.updateSearchPanel(wrapper) });
  },
  showErrorCard(wrapper, message, code, suggestion, detail, httpStatus) {
    const mdDiv = wrapper.mdDivRef; if (!mdDiv) return;
    if (wrapper._thinkingTimerInterval) { clearInterval(wrapper._thinkingTimerInterval); wrapper._thinkingTimerInterval = null; }
    if (wrapper.thinkingCardRef) wrapper.thinkingCardRef.classList.add('hidden');
    const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
    let h = '<div class="error-card"><div class="error-card-header"><span class="error-card-icon">⚠</span><span class="error-card-title">请求失败</span>';
    if (code) h += `<span class="error-card-code">${esc(code)}</span>`;
    h += '</div>';
    h += `<div class="error-card-message">${esc(message)}</div>`;
    if (suggestion) h += `<div class="error-card-suggestion">💡 ${esc(suggestion)}</div>`;
    if (detail) h += `<details class="error-card-details"><summary>技术详情</summary><pre>${esc(detail)}</pre></details>`;
    h += '</div>';
    mdDiv.innerHTML = h; mdDiv.classList.remove('streaming-cursor');
    window.NotionAI.Utils.DOM.scrollToBottom();
  }
};
</script>

<script>
/* ===== STREAMING ===== */
window.NotionAI.Chat.Streaming = {
  async streamResponse(chat, model, aiWrapper) {
    const searchState = { queries: [], sources: [] };
    let thinkingText = '', fullAiReply = '';
    const requestMessages = chat.messages.filter(m=>m&&typeof m==='object'&&(m.role==='user'||m.role==='assistant')).map(m=>({role:m.role,content:String(m.content||''),thinking:String(m.thinking||'')}));
    STATE.controller = new AbortController();
    try {
      const response = await fetch(`${window.NotionAI.Core.State.get('baseUrl')}/v1/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${window.NotionAI.Core.State.get('apiKey')}`,'X-Client-Type':window.NotionAI.Core.Constants.CLIENT_TYPE},
        body:JSON.stringify({model,messages:requestMessages,conversation_id:chat.conversationId||null,stream:true}), signal:STATE.controller.signal
      });
      if(window.NotionAI.API.Client.checkMemoryStatus(response))this.notifyMemoryDegradedOnce();
      const bid=window.NotionAI.API.Client.getConversationId(response);
      if(bid&&chat.conversationId!==bid){window.NotionAI.Chat.Storage.updateConversationId(chat.id,bid);chat.conversationId=bid}
      if(!response.ok){
        let ei={message:`HTTP Error: ${response.status}`,code:'',suggestion:''};
        try{const eb=await response.json();if(eb?.error){ei.message=eb.error.message||ei.message;ei.code=eb.error.code||'';ei.suggestion=eb.error.suggestion||'';ei.detail=eb.error.detail||''}else if(eb?.detail){ei.message=eb.detail}}catch(e){}
        if(response.status===401){ei.message=ei.message||"API KEY doesn't match.";ei.suggestion=ei.suggestion||"Check your API Key in Settings."}
        const err=new Error(ei.message);err.errorCode=ei.code;err.suggestion=ei.suggestion;err.errorDetail=ei.detail;err.httpStatus=response.status;throw err;
      }
      return await this.processStream(response,aiWrapper,searchState,thinkingText,fullAiReply);
    } catch(err) {
      if(err.name!=='AbortError'){console.error('API Error:',err);window.NotionAI.Chat.Renderer.showErrorCard(aiWrapper,err.message,err.errorCode||'',err.suggestion||'',err.errorDetail||'',err.httpStatus||0)}
      throw err;
    }
  },
  async processStream(response,aiWrapper,searchState,thinkingText,fullAiReply) {
    const reader=response.body.getReader(),decoder=new TextDecoder('utf-8');let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const evts=buf.split('\n\n');buf=evts.pop()||'';
      for(const eb of evts){for(let line of eb.split('\n')){line=line.trim();if(!line.startsWith('data:'))continue;const p=line.slice(5).trim();const r=this.consumePayload(p,aiWrapper,searchState,thinkingText,fullAiReply);if(r.thinkingText!==undefined)thinkingText=r.thinkingText;if(r.fullAiReply!==undefined)fullAiReply=r.fullAiReply}}}
    if(buf.trim().startsWith('data:')){const p=buf.trim().slice(5).trim();const r=this.consumePayload(p,aiWrapper,searchState,thinkingText,fullAiReply);if(r.thinkingText!==undefined)thinkingText=r.thinkingText;if(r.fullAiReply!==undefined)fullAiReply=r.fullAiReply}
    return{fullAiReply,thinkingText,searchState};
  },
  consumePayload(payload,aiWrapper,searchState,thinkingText,fullAiReply) {
    if(!payload||payload==='[DONE]')return{thinkingText,fullAiReply};
    let d;try{d=JSON.parse(payload)}catch(e){return{thinkingText,fullAiReply}}
    if(d?.type==='search_metadata'){this.mergeSearchState(searchState,d.searches||{});aiWrapper.searchData=searchState;window.NotionAI.Chat.Renderer.updateSearchPanel(aiWrapper);return{thinkingText,fullAiReply}}
    if(d?.type==='thinking_chunk'){const c=typeof d.text==='string'?d.text:'';if(c){thinkingText+=c;aiWrapper.thinkingText=thinkingText;window.NotionAI.Chat.Renderer.updateThinkingPanel(aiWrapper)}return{thinkingText,fullAiReply}}
    if(d?.type==='content_replace'){const r=typeof d.content==='string'?d.content:'';if(r){fullAiReply=r;if(aiWrapper){aiWrapper._partialReply=fullAiReply;if(aiWrapper._onFirstToken)aiWrapper._onFirstToken()}window.NotionAI.Chat.Renderer.updateAIMessage(aiWrapper,fullAiReply,false)}return{thinkingText,fullAiReply}}
    if(d?.type==='thinking_replace'){thinkingText=typeof d.thinking==='string'?d.thinking:'';aiWrapper.thinkingText=thinkingText;window.NotionAI.Chat.Renderer.updateThinkingPanel(aiWrapper);return{thinkingText,fullAiReply}}
    const dr=d?.choices?.[0]?.delta?.reasoning_content||'';
    if(dr){thinkingText+=dr;aiWrapper.thinkingText=thinkingText;window.NotionAI.Chat.Renderer.updateThinkingPanel(aiWrapper);return{thinkingText,fullAiReply}}
    const dc=d?.choices?.[0]?.delta?.content||'';
    if(dc){fullAiReply+=dc;if(aiWrapper){aiWrapper._partialReply=fullAiReply;if(aiWrapper._onFirstToken)aiWrapper._onFirstToken()}window.NotionAI.Chat.Renderer.updateAIMessage(aiWrapper,fullAiReply,false);return{thinkingText,fullAiReply}}
    return{thinkingText,fullAiReply};
  },
  mergeSearchState(target,payload) {
    const n=window.NotionAI.Utils.Validation.normalizeSearchPayload(payload);
    n.queries.forEach(q=>{if(!target.queries.includes(q))target.queries.push(q)});
    n.sources.forEach(s=>{if(!target.sources.some(e=>e.title===s.title&&e.url===s.url))target.sources.push(s)});
  },
  notifyMemoryDegradedOnce(){if(!this._memoryNotified){this._memoryNotified=true;const b=document.getElementById('memoryBanner');if(b)b.classList.remove('hidden')}}
};

/* ===== UI: THEME ===== */
window.NotionAI.UI.Theme = {
  toggle(){const c=window.NotionAI.Core.State.get('theme');const n=c==='dark'?'light':'dark';window.NotionAI.Core.State.set('theme',n);localStorage.setItem('theme',n);this.apply(n)},
  apply(t){
    document.documentElement.setAttribute('data-theme',t);
    const sun=document.getElementById('sunIcon'),moon=document.getElementById('moonIcon');
    const hljsLight=document.getElementById('hljs-light'),hljsDark=document.getElementById('hljs-dark');
    if(t==='dark'){
      document.documentElement.classList.add('dark');
      if(sun)sun.classList.remove('hidden');if(moon)moon.classList.add('hidden');
      if(hljsLight)hljsLight.disabled=true;if(hljsDark)hljsDark.disabled=false;
    } else {
      document.documentElement.classList.remove('dark');
      if(sun)sun.classList.add('hidden');if(moon)moon.classList.remove('hidden');
      if(hljsLight)hljsLight.disabled=false;if(hljsDark)hljsDark.disabled=true;
    }
  },
  init(){this.apply(window.NotionAI.Core.State.get('theme'))}
};

/* ===== UI: SIDEBAR ===== */
window.NotionAI.UI.Sidebar = {
  toggle(show){const s=document.getElementById('sidebar'),b=document.getElementById('mobileBackdrop');if(show){s.classList.add('open');b.classList.remove('hidden')}else{s.classList.remove('open');b.classList.add('hidden')}},
  open(){this.toggle(true)},close(){this.toggle(false)}
};

/* ===== UI: INPUT ===== */
window.NotionAI.UI.Input = {
  autoResize(){const i=document.getElementById('chatInput');i.style.height='24px';i.style.height=Math.min(i.scrollHeight,160)+'px'},
  handleKeydown(e,onSend){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();onSend()}},
  clear(){document.getElementById('chatInput').value='';this.autoResize()},
  focus(){document.getElementById('chatInput').focus()},
  getValue(){return document.getElementById('chatInput').value.trim()},
  enable(){document.getElementById('chatInput').disabled=false;document.getElementById('sendBtn').disabled=false},
  disable(){document.getElementById('chatInput').disabled=true}
};

/* ===== UI: MODAL ===== */
window.NotionAI.UI.Modal = {
  openRenameModal(chatId){const chats=window.NotionAI.Core.State.get('chats');const chat=chats.find(c=>c.id===chatId);if(!chat)return;window.NotionAI.Core.State.set('chatToRename',chatId);const input=document.getElementById('renameModalInput');input.value=chat.title;document.getElementById('renameModal').classList.remove('hidden');setTimeout(()=>input.focus(),50)},
  closeRenameModal(){document.getElementById('renameModal').classList.add('hidden');window.NotionAI.Core.State.set('chatToRename',null)},
  saveRename(){const id=window.NotionAI.Core.State.get('chatToRename');if(!id)return;const t=document.getElementById('renameModalInput').value.trim();if(t)window.NotionAI.Chat.Manager.renameChat(id,t);this.closeRenameModal()}
};
</script>

<script>
/* ===== CHAT MANAGER ===== */
window.NotionAI.Chat.Manager = {
  startNewChat() {
    if(STATE.isGenerating)return;
    const id=Date.now().toString();
    window.NotionAI.Core.State.set('currentChatId',id);
    try{ localStorage.removeItem('claude_last_chat'); }catch(e){}
    document.getElementById('headerTitle').classList.add('hidden');
    document.getElementById('chatContainer').innerHTML='';
    window.NotionAI.UI.Input.clear();
    document.getElementById('welcomeScreen').classList.remove('hidden');
    if(typeof updateWelcomeGreeting==='function')updateWelcomeGreeting();
    if(typeof renderWelcomeSuggestions==='function')renderWelcomeSuggestions();
    if(window.innerWidth<768)window.NotionAI.UI.Sidebar.close();
    window.NotionAI.UI.Input.focus();
    this.renderChatList();
  },
  selectChat(chatId) {
    if(STATE.isGenerating)return;
    const chats=STATE.chats,chat=chats.find(c=>String(c.id)===String(chatId));
    const container=document.getElementById('chatContainer');
    const welcome=document.getElementById('welcomeScreen');
    if(!chat){
      // 会话已不在数据里（被删或数据被覆盖）：明确提示，不要静默无反应
      if(welcome)welcome.classList.add('hidden');
      if(container)container.innerHTML='<div class="chat-empty-hint">这个会话已不存在，可能已被删除。</div>';
      const h=document.getElementById('headerTitle');
      if(h){h.textContent='会话已不存在';h.classList.remove('hidden')}
      return;
    }
    try{
    window.NotionAI.Core.State.set('currentChatId',chatId);
    document.getElementById('headerTitle').textContent=chat.title||'会话';
    document.getElementById('headerTitle').classList.remove('hidden');
    container.innerHTML='';
    welcome.classList.add('hidden');

    const msgs=Array.isArray(chat.messages)?chat.messages:[];
    let rendered=0;
    msgs.forEach(msg=>{
      try{
        if(!msg||(msg.role!=='user'&&msg.role!=='assistant'))return;
        const w=window.NotionAI.Chat.Renderer.appendMessage(
          msg.role,typeof msg.content==='string'?msg.content:'',true,msg.modelDisplayName||null);
        if(msg.role==='assistant'){
          const rt=typeof msg.thinking==='string'?msg.thinking:'';
          const rs=window.NotionAI.Utils.Validation.normalizeSearchPayload(msg.search);
          if(rt.trim()){w.thinkingText=rt;window.NotionAI.Chat.Renderer.updateThinkingPanel(w)}
          if(rs.queries.length+rs.sources.length>0){w.searchData=rs;window.NotionAI.Chat.Renderer.updateSearchPanel(w)}
        }
        rendered++;
      }catch(err){
        console.error('渲染消息失败',msg&&msg.role,err);
      }
    });

    // 空会话或全部渲染失败时给明确提示，绝不留白屏（白屏会被当成"记录消失了"）
    if(rendered===0){
      const hint=document.createElement('div');
      hint.className='chat-empty-hint';
      hint.textContent=msgs.length?'这个会话的消息无法显示，可能已损坏。':'这个会话还没有消息。';
      container.appendChild(hint);
    }
    console.info('[chat] open id=%s messages=%d rendered=%d', chatId, msgs.length, rendered);

    try{ localStorage.setItem('claude_last_chat', String(chatId)); }catch(e){}
    var sb=document.getElementById('sidebar');
    if(window.innerWidth<768&&sb&&sb.classList.contains('open'))window.NotionAI.UI.Sidebar.close();
    window.NotionAI.Utils.DOM.scrollToBottom();
    // 只切换高亮，不重建列表——重建正是"列表整块消失"的隐患来源
    document.querySelectorAll('#chatList .chat-item').forEach(function(el){
      el.classList.toggle('active', el.dataset.chatId===String(chatId));
    });
    }catch(err){
      console.error('打开会话失败', chatId, err);
      const tip=document.createElement('div');
      tip.className='chat-empty-hint';
      tip.textContent='打开这个会话时出错：'+(err&&err.message?err.message:String(err));
      if(container)container.replaceChildren(tip);
      if(welcome)welcome.classList.add('hidden');
    }
  },
  async deleteChat(chatId) {
    if(STATE.isGenerating)return;
    const chats=STATE.chats,chat=chats.find(c=>c.id===chatId);if(!chat)return;
    // 侧栏菜单紧贴会话项，误点会直接丢记录——加一道确认
    if(typeof window.confirm==='function'&&!window.confirm('删除「'+(chat.title||'这个会话')+'」？此操作不可撤销。'))return;
    if(chat.conversationId){const ok=await window.NotionAI.API.Client.deleteConversation(chat.conversationId);if(!ok)return}
    window.NotionAI.Chat.Storage.deleteChat(chatId);
    if(STATE.currentChatId===chatId)this.startNewChat();
    this.renderChatList();
  },
  renameChat(chatId,newTitle) {
    window.NotionAI.Chat.Storage.updateChatTitle(chatId,newTitle);
    if(STATE.currentChatId===chatId)document.getElementById('headerTitle').textContent=newTitle;
    this.renderChatList();
  },
  toggleStar(chatId){window.NotionAI.Chat.Storage.toggleStar(chatId);this.renderChatList()},

  renderChatList() {
    const cl=document.getElementById('chatList');
    if(!cl) return;
    const frag=document.createDocumentFragment();
    try{
      const chats=Array.isArray(STATE.chats)?STATE.chats:[];
      const titleOf=c=>String((c&&c.title)||'会话');
      const num=id=>{const n=Number(id);return isNaN(n)?0:n};
      const starred=chats.filter(c=>c&&c.starred).sort((a,b)=>num(b.id)-num(a.id));
      const recent=chats.filter(c=>c&&!c.starred).sort((a,b)=>num(b.id)-num(a.id));
      const searchVal=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();

      const renderItems=(items,filterFn)=>{
        let filtered=filterFn?items.filter(filterFn):items;
        filtered.forEach(chat=>{
          const item=document.createElement('div');
          item.className=`chat-item${String(chat.id)===String(STATE.currentChatId)?' active':''}`;
          item.dataset.chatId=String(chat.id);
          const title=document.createElement('span');title.className='chat-item-title';title.textContent=titleOf(chat);
          const mc=document.createElement('div');mc.className='chat-dropdown-container';mc.style.cssText='position:relative;display:flex;align-items:center';
          const mb=document.createElement('button');mb.className='chat-item-menu-btn';
          mb.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.5"/><circle cx="6" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>';
          mb.onclick=e=>{e.stopPropagation();this.toggleChatDropdown(e,chat.id)};
          const dd=this._createDropdown(chat);
          mc.appendChild(mb);mc.appendChild(dd);
          item.appendChild(title);item.appendChild(mc);frag.appendChild(item);
        });
      };
      const filter=searchVal?c=>titleOf(c).toLowerCase().includes(searchVal):null;

      if(starred.length>0){const h=document.createElement('div');h.className='chat-section-header';h.textContent='收藏';frag.appendChild(h);renderItems(starred,filter)}
      if(recent.length>0){
        const today=new Date();today.setHours(0,0,0,0);
        const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
        const todayItems=[],yesterdayItems=[],olderItems=[];
        let filtered=filter?recent.filter(filter):recent;
        filtered.forEach(c=>{const d=new Date(parseInt(c.id));if(d>=today)todayItems.push(c);else if(d>=yesterday)yesterdayItems.push(c);else olderItems.push(c)});
        if(todayItems.length){const h=document.createElement('div');h.className='chat-section-header';h.textContent='今天';frag.appendChild(h);renderItems(todayItems)}
        if(yesterdayItems.length){const h=document.createElement('div');h.className='chat-section-header';h.textContent='昨天';frag.appendChild(h);renderItems(yesterdayItems)}
        if(olderItems.length){const h=document.createElement('div');h.className='chat-section-header';h.textContent='更早';frag.appendChild(h);renderItems(olderItems)}
      }
      if(!frag.childNodes.length && chats.length){
        const empty=document.createElement('div');
        empty.className='chat-empty-hint';
        empty.style.margin='10px';
        empty.textContent=searchVal?('没有匹配「'+searchVal+'」的会话'):'没有可显示的会话';
        if(searchVal){
          const btn=document.createElement('button');
          btn.type='button';
          btn.className='msg-action';
          btn.style.marginLeft='6px';
          btn.textContent='清除搜索';
          btn.onclick=function(){
            const box=document.getElementById('searchInput');
            if(box)box.value='';
            window.NotionAI.Chat.Manager.renderChatList();
          };
          empty.appendChild(btn);
        }
        frag.appendChild(empty);
      }
      cl.replaceChildren(frag);
    }catch(err){
      // 关键：渲染失败时不要把旧列表清空，否则看起来像"聊天记录消失了"
      console.error('renderChatList 失败，已保留原列表', err);
      if(!cl.children.length){
        const tip=document.createElement('div');
        tip.className='chat-empty-hint';
        tip.style.margin='12px';
        tip.textContent='会话列表渲染失败，请按 F12 查看控制台。';
        cl.replaceChildren(tip);
      }
    }
  },

  _createDropdown(chat) {
    const dd=document.createElement('div');dd.id=`dropdown-${chat.id}`;dd.className='custom-dropdown';
    const actions=[{action:'star',label:chat.starred?'取消收藏':'收藏'},{action:'rename',label:'重命名'},{action:'divider'},{action:'delete',label:'删除',danger:true}];
    actions.forEach(a=>{
      if(a.action==='divider'){const d=document.createElement('div');d.className='dropdown-divider';dd.appendChild(d);return}
      const btn=document.createElement('button');btn.className=`dropdown-item${a.danger?' danger':''}`;btn.textContent=a.label;
      btn.onclick=e=>{e.stopPropagation();this.closeChatDropdown();this.handleMenuAction(a.action,chat.id)};
      dd.appendChild(btn);
    });return dd;
  },

// Sidebar resize
function setupSidebarResize(){
  const sidebar=document.getElementById('sidebar');
  const handle=document.getElementById('sidebarResizeHandle');
  if(!sidebar||!handle)return;
  let startX,startW;
  handle.addEventListener('mousedown',e=>{
    e.preventDefault();
    startX=e.clientX;startW=sidebar.offsetWidth;
    handle.classList.add('active');
    sidebar.style.transition='none';
    const onMove=ev=>{
      const w=Math.min(400,Math.max(160,startW+(ev.clientX-startX)));
      sidebar.style.width=w+'px';
    };
    const onUp=()=>{
      handle.classList.remove('active');
      sidebar.style.transition='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

async function handleSend(){

/* ===== 消息元素映射（不参与 JSON 序列化） ===== */
const MSG_EL = new WeakMap();

function lastUserIndex(chat){
  for(let i=chat.messages.length-1;i>=0;i--)if(chat.messages[i].role==='user')return i;
  return -1;
}

function renderHistory(chat){
  const c=document.getElementById('chatContainer');
  if(!c)return;
  c.innerHTML='';
  document.getElementById('welcomeScreen').classList.add('hidden');
  chat.messages.forEach(m=>{
    const w=window.NotionAI.Chat.Renderer.appendMessage(m.role,m.content||'',true,m.modelDisplayName);
    MSG_EL.set(m,w);
  });
  window.NotionAI.Utils.DOM.scrollToBottom();
}

/* 从最后一条提问重新生成 */
async function regenerateLastAnswer(){
  if(STATE.isGenerating)return;
  const chat=STATE.chats.find(c=>c.id===STATE.currentChatId);
  if(!chat)return;
  const idx=lastUserIndex(chat);
  if(idx<0)return;
  chat.messages=chat.messages.slice(0,idx+1);
  renderHistory(chat);
  window.NotionAI.Chat.Storage.saveChats();
  await runGeneration(chat);
}

/* 就地编辑用户消息并重发 */
function beginEditMessage(wrapper){
  const chat=STATE.chats.find(c=>c.id===STATE.currentChatId);
  if(!chat||STATE.isGenerating)return;
  const idx=chat.messages.findIndex(m=>MSG_EL.get(m)===wrapper);
  const bubble=wrapper&&wrapper.querySelector('.user-bubble');
  if(idx<0||!bubble||bubble.dataset.editing==='1')return;

  const old=bubble.textContent;
  bubble.dataset.editing='1';
  bubble.textContent='';
  const ta=document.createElement('textarea');
  ta.className='edit-textarea';
  ta.value=old;
  const row=document.createElement('div');
  row.className='edit-actions';
  const save=document.createElement('button');
  save.type='button';save.className='msg-action primary';save.textContent='发送';
  const cancel=document.createElement('button');
  cancel.type='button';cancel.className='msg-action';cancel.textContent='取消';
  row.appendChild(save);row.appendChild(cancel);
  bubble.appendChild(ta);bubble.appendChild(row);
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);

  const restore=()=>{delete bubble.dataset.editing;bubble.textContent=old};
  cancel.onclick=restore;
  ta.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();restore()}
    else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();save.click()}
  });
  save.onclick=async()=>{
    const t=ta.value.trim();
    if(!t)return;
    chat.messages[idx].content=t;
    chat.messages=chat.messages.slice(0,idx+1);
    renderHistory(chat);
    window.NotionAI.Chat.Storage.saveChats();
    await runGeneration(chat);
  };
}

/* ===== 生成流程：发送 / 重新生成 / 编辑重发 共用 ===== */
async function runGeneration(chat){
  showThinkingIndicator();
  const selectedModel=window.NotionAI.API.Models.getCurrentModel();
  const selectedModelDisplayName=window.NotionAI.API.Models.getCurrentModelLabel();
  STATE.isGenerating=true;window.NotionAI.UI.Input.disable();_updateSendButton(true);
  let aiWrapper=null,firstTokenReceived=false;
  try{
    aiWrapper=window.NotionAI.Chat.Renderer.appendMessage('assistant','',false,selectedModelDisplayName);
    aiWrapper._onFirstToken=function(){if(!firstTokenReceived){firstTokenReceived=true;removeThinkingIndicator()}};
    aiWrapper._thinkingStartTime=Date.now();
    const timerEl=aiWrapper.thinkingCardRef?.querySelector('.thinking-header-timer');
    if(timerEl)aiWrapper._thinkingTimerInterval=setInterval(()=>{if(aiWrapper._thinkingStartTime)timerEl.textContent=Math.round((Date.now()-aiWrapper._thinkingStartTime)/1000)+'s'},1000);
    window.NotionAI.Utils.DOM.scrollToBottom();
    const result=await window.NotionAI.Chat.Streaming.streamResponse(chat,selectedModel,aiWrapper);
    removeThinkingIndicator();
    if(aiWrapper._thinkingTimerInterval){clearInterval(aiWrapper._thinkingTimerInterval);aiWrapper._thinkingTimerInterval=null}
    const ns=window.NotionAI.Utils.Validation.normalizeSearchPayload(result.searchState);
    if(result.fullAiReply.trim()){
      window.NotionAI.Chat.Renderer.updateAIMessage(aiWrapper,result.fullAiReply,true);
      const am={role:'assistant',content:result.fullAiReply,thinking:result.thinkingText,search:ns,modelDisplayName:selectedModelDisplayName};
      chat.messages.push(am);
      MSG_EL.set(am,aiWrapper);
      window.NotionAI.Chat.Storage.saveChats();
    }else{window.NotionAI.Chat.Renderer.updateAIMessage(aiWrapper,'*暂无可见回复。*',true)}
  }catch(err){
    removeThinkingIndicator();
    if(aiWrapper?._thinkingTimerInterval){clearInterval(aiWrapper._thinkingTimerInterval);aiWrapper._thinkingTimerInterval=null}
    if(err.name==='AbortError'){
      /* 用户点了停止：保留已经生成的部分，不要整段丢弃 */
      const partial=(aiWrapper&&aiWrapper._partialReply)||'';
      if(partial.trim()){
        window.NotionAI.Chat.Renderer.updateAIMessage(aiWrapper,partial,true);
        const am={role:'assistant',content:partial,thinking:aiWrapper.thinkingText||'',search:{queries:[],sources:[]},modelDisplayName:selectedModelDisplayName,stopped:true};
        chat.messages.push(am);
        MSG_EL.set(am,aiWrapper);
        window.NotionAI.Chat.Storage.saveChats();
      }else if(aiWrapper){aiWrapper.remove()}
    }else{console.error('API Error:',err)}
  }
  finally{STATE.isGenerating=false;window.NotionAI.UI.Input.enable();window.NotionAI.UI.Input.focus();STATE.controller=null;_updateSendButton(false)}
}

  document.getElementById('memoryBannerClose').addEventListener('click',()=>document.getElementById('memoryBanner').classList.add('hidden'));
  document.getElementById('settingsBtn').addEventListener('click',()=>window.NotionAI.API.Settings.open());
  document.getElementById('cancelSettingsBtn').addEventListener('click',()=>window.NotionAI.API.Settings.close());
  document.getElementById('saveSettingsBtn').addEventListener('click',()=>window.NotionAI.API.Settings.save());
  document.getElementById('cancelRenameBtn').addEventListener('click',()=>window.NotionAI.UI.Modal.closeRenameModal());
  document.getElementById('saveRenameBtn').addEventListener('click',()=>window.NotionAI.UI.Modal.saveRename());
  document.getElementById('renameModalInput').addEventListener('keydown',e=>{if(e.key==='Enter')window.NotionAI.UI.Modal.saveRename();if(e.key==='Escape')window.NotionAI.UI.Modal.closeRenameModal()});
  document.getElementById('modelTriggerBtn').addEventListener('click',e=>{e.stopPropagation();toggleModelDropdown()});
  document.addEventListener('click',e=>{const dd=document.getElementById('customModelDropdown');if(!dd.contains(e.target)&&e.target.id!=='modelTriggerBtn')dd.classList.remove('open')});
  document.getElementById('searchInput').addEventListener('input',()=>window.NotionAI.Chat.Manager.renderChatList());

  // 回到底部：向上滚动时才出现
  const chatScroller = document.getElementById('chatContainer');
  const jumpBtn = document.getElementById('scrollBottomBtn');
  if (chatScroller && jumpBtn) {
    chatScroller.addEventListener('scroll', () => {
      const gap = chatScroller.scrollHeight - chatScroller.scrollTop - chatScroller.clientHeight;
      jumpBtn.classList.toggle('hidden', gap < 120);
    }, { passive: true });
    jumpBtn.addEventListener('click', () => window.NotionAI.Utils.DOM.scrollToBottom());
  }

  // Esc 停止生成（弹窗打开时不抢 Esc）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !STATE.isGenerating) return;
    const settingsOpen = !document.getElementById('settingsModal').classList.contains('hidden');
    const renameOpen = !document.getElementById('renameModal').classList.contains('hidden');
    if (settingsOpen || renameOpen) return;
    if (STATE.controller) STATE.controller.abort();
  });

  // 恢复上次打开的会话：即使页面被外部原因重载，也不会"点开就回到空白"
  var lastChat=null;
  try{ lastChat=localStorage.getItem('claude_last_chat'); }catch(e){}
  if(lastChat&&STATE.chats.some(function(c){return String(c.id)===lastChat})){
    window.NotionAI.Chat.Manager.selectChat(lastChat);
  }else if(!STATE.currentChatId){
    window.NotionAI.Chat.Manager.startNewChat();
  }
}

setInterval(updateWelcomeGreeting,60000);
window.addEventListener('DOMContentLoaded',init);
</script>

  var reloadBtn = document.getElementById('opsReloadBtn');
  var PANEL = '/admin-dashboard/';

  // 面板与聊天同源，直接写入本地存储实现零配置（Key 由本机 .env 决定）
  function seedPanelAuth() {
    try {
      if (!localStorage.getItem('claude_base_url')) {
        localStorage.setItem('claude_base_url', location.origin);
      }
      if (!localStorage.getItem('claude_api_key')) {
        localStorage.setItem('claude_api_key', 'admin');
      }
    } catch (e) {}
  }

  function open() {
    seedPanelAuth();
    // 每次都带时间戳，避免 iframe 复用浏览器里缓存的旧面板
    frame.setAttribute('src', PANEL + '?t=' + Date.now());
    overlay.classList.remove('hidden');
    if (history.replaceState) history.replaceState(null, '', '#ops');
  }
  function close() {
    overlay.classList.add('hidden');
    if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
    if (openBtn) openBtn.focus();
  }
  if (openBtn) openBtn.addEventListener('click', open);
  if (closeBtn) closeBtn.addEventListener('click', close);
  // 兜底：面板里若有链接把 iframe 导航到非面板页面（例如「返回聊天工作台」），
  // 就把这次导航交给顶层窗口，避免聊天界面被塞进覆盖层里、地址还停在 #ops。
  if (frame) {
    frame.addEventListener('load', function () {
      try {
        var w = frame.contentWindow;
        if (!w || !/^https?:/.test(w.location.protocol)) return;
        if (w.location.pathname.indexOf('/admin-dashboard') === 0) return;
        var target = w.location.href;
        close();
        location.href = target;
      } catch (e) {}
    });
  }
  if (reloadBtn) reloadBtn.addEventListener('click', function () {
    frame.setAttribute('src', PANEL + '?t=' + Date.now());
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.classList.contains('hidden')) close();
  });
  if (location.hash === '#ops') open();
})();
</script>

<script>
/* ===== 侧栏状态卡：读取真实 /health ===== */
(function () {
  var timer = null;

  function baseUrl() {
    try {
      return (window.NotionAI.Core.State.get('baseUrl') || location.origin).replace(/\/+$/, '');
    } catch (e) {
      return location.origin;
    }
  }

  function paint(ok, title, badge, meta) {
    var card = document.getElementById('statusCard');
    if (!card) return;
    card.dataset.state = ok ? 'ok' : 'down';
    var t = document.getElementById('statusTitle');
    var b = document.getElementById('statusAccounts');
    var m = document.getElementById('statusMeta');
    if (t) t.textContent = title;
    if (b) b.textContent = badge;
    if (m) m.textContent = meta;
  }

  function refresh() {
    var t0 = performance.now();
    fetch(baseUrl() + '/health', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (h) {
        var ms = Math.round(performance.now() - t0);
        var total = h.accounts_total != null ? h.accounts_total : (h.accounts || 0);
        var avail = h.accounts_available != null ? h.accounts_available : (h.accounts || 0);
        var parts = [];
        parts.push('MCP ' + (h.mcp ? '已启用' : '关闭'));
        if (h.accounts_cooling) parts.push('冷却 ' + h.accounts_cooling);
        parts.push('延迟 ' + ms + ' ms');
        paint(true, '网关运行中', avail + '/' + total, parts.join(' · '));
      })
      .catch(function (e) {
        paint(false, '网关不可用', '—', String((e && e.message) || e).slice(0, 48));
      });
  }

  document.addEventListener('DOMContentLoaded', function () {
    refresh();
    timer = setInterval(refresh, 30000);
  });
  window.addEventListener('beforeunload', function () { if (timer) clearInterval(timer); });
})();
</script>

<script>
/* ===== 模型列表自动同步：每 5 分钟 + 窗口聚焦时（60s 节流） ===== */
(function () {
  var REFRESH_MS = 5 * 60 * 1000;
  var FOCUS_THROTTLE_MS = 60 * 1000;
  var lastAt = 0;

  function sync(force) {
    var now = Date.now();
    if (!force && now - lastAt < FOCUS_THROTTLE_MS) return;
    try {
      if (typeof STATE !== 'undefined' && STATE.isGenerating) return;
    } catch (e) {}
    lastAt = now;
    try {
      window.NotionAI.API.Models.refreshFromServer({ silent: true });
    } catch (e) {}
  }

  document.addEventListener('DOMContentLoaded', function () {
    // 首屏先让静态列表渲染出来，再异步对齐服务端
    setTimeout(function () { sync(true); }, 1200);
    window.setInterval(function () { sync(false); }, REFRESH_MS);
    window.addEventListener('focus', function () { sync(false); });
  });
})();
</script>

<script>
/* ===== 版本自检 + bfcache 防护 ===== */
(function () {
  // #ops 是片段导航：浏览器会直接恢复前进/后退快照、根本不发请求，
  // 于是前端改了却仍看到旧页面。从快照恢复时强制重载一次。
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
      try { location.reload(); } catch (err) {}
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('buildStamp');
    if (!el) return;
    var d = new Date(document.lastModified);
    if (isNaN(d.getTime())) return;
    var pad = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = '构建 ' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    el.title = '当前页面最后修改时间：' + d.toLocaleString('zh-CN');
  });
})();

</script>
